name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-pi05.txt -r requirements-lingbot-vla.txt
      - run: npm test
      - run: npm run demo
      - run: npm run demo:framework -- --output "$RUNNER_TEMP/framework"
      - run: npm run demo:robots -- --output "$RUNNER_TEMP/robots"
      - run: npm run demo:routed -- --output "$RUNNER_TEMP/routed"
      - run: npm run rea -- run examples/async-system.config.mjs --output "$RUNNER_TEMP/async"
      - run: npm run demo:offline
      - run: npm run demo:service
      - run: npm run rea -- list
      - run: npm run rea -- doctor demo

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-pi05.txt -r requirements-lingbot-vla.txt
      - run: python -m unittest discover -s test
      - run: cd agent-vla-async && PYTHONPATH=src python -m unittest discover -s tests

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: find . -name "*.mjs" -not -path "./node_modules/*" -print0 | xargs -0 -n1 node --check
      - run: python -m compileall -q -x "node_modules|\.git" .
      - name: no private hosts, paths or credentials
        run: |
          if git grep -n -I -E '(/home/[a-z0-9_]+/|/Users/[A-Za-z0-9_]+/|/data/[a-z0-9_]+/|\b(10\.[0-9]+|192\.168|172\.(1[6-9]|2[0-9]|3[01]))\.[0-9]+\.[0-9]+\b|sk-[A-Za-z0-9]{20,})' -- ':!.github/workflows/ci.yml' ':!test/*'; then
            echo "Found a private host, path or credential-like string; use placeholders instead." >&2
            exit 1
          fi
