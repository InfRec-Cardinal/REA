# Drop-in for g1-vla-cerebellum.service that enables execution (double opt-in: the request must also ask for it).
# Install as ~/.config/systemd/user/g1-vla-cerebellum.service.d/execute-mode.conf and adjust the path.
[Service]
ExecStart=
ExecStart=%h/rea/agent-vla-async/scripts/g1vla daemon --policy groot --execute
